name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Die Actions stehen auf ihrem jeweils neuesten Hauptstand. Aeltere liefen
      # zwar noch, aber auf Node 20, das GitHub in den Runnern abschaltet: Sie
      # wurden zwangsweise auf Node 24 gehoben, mit einer Warnung in jedem Lauf.

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Die Tests pruefen auch die erzeugten Spieldaten unter public/data:
      # Baumaufbau, Vollstaendigkeit der Namen, Bildrechte und die fachlichen
      # Stichproben (Loewe und Tiger treffen sich in Panthera und so weiter).
      # Ein kaputter Datenstand kommt damit gar nicht erst online.
      - name: Run tests
        run: npm test

      # DEPLOY_TARGET setzt die Basis-URL auf /artenmonster/, weil Pages die
      # Seite unter dem Repository-Namen ausliefert und nicht unter der Wurzel.
      - name: Build
        env:
          DEPLOY_TARGET: gh-pages
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
